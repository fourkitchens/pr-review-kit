# Shared Claude Code review workflow. Each project's
# .github/workflows/claude-review.yml calls it (see templates/workflow/claude-review.yml),
# so changes here reach every project on its next run.
#
# It runs in the calling project's context: it checks out the project, reads the
# project's docs/agents/pr-review/, and reviews the PR that triggered the caller.
# The label is removed when the run finishes so it can be re-added to review again.
#
# Setup steps: https://github.com/fourkitchens/pr-review-kit/blob/main/docs/SETUP.md
#
# Note: for pull requests opened from forks, GitHub does not expose secrets, so the
# review will not run for fork PRs.

name: Claude Code Review

on:
  workflow_call:
    inputs:
      organization-id:
        description: Productive organization ID.
        type: string
        default: '59815'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      PRODUCTIVE_API_TOKEN:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    # A review takes 3–6 minutes; this stops a stuck one from running for hours.
    timeout-minutes: 20
    # One review per PR at a time: adding the label again cancels the running one.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Fetches the Productive task so the review can check its acceptance
      # criteria. Finds the task, first match wins:
      #   1. A task link in the PR description.
      #   2. The start of a branch segment: the task ID from the task's URL
      #      (feature/21323404-login-fix) or the task code shown in Productive, in
      #      any case (feature/PROJ-123-login-fix). Same convention as
      #      fourkitchens/productive-sync.
      # Skipped with a notice when there is no token or no task; the review then
      # falls back to the PR description.
      - name: Fetch Productive task
        env:
          PRODUCTIVE_API_TOKEN: ${{ secrets.PRODUCTIVE_API_TOKEN }}
          PRODUCTIVE_ORG_ID: ${{ inputs.organization-id }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.claude-review/ticket.md"
          RESPONSE="$RUNNER_TEMP/productive.json"
          mkdir -p "$(dirname "$OUT")"
          skip() {
            echo "::notice title=Productive task::$1"
            echo "$1" > "$OUT"
            echo "**Productive task:** $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ -z "$PRODUCTIVE_API_TOKEN" ]; then
            skip "No PRODUCTIVE_API_TOKEN; the review uses the PR description."
          fi
          # Writes the response to $RESPONSE and prints the HTTP status (000 when
          # Productive can't be reached). Headers go to curl on stdin, so the token
          # stays out of the process list. --globoff: filter[...] is not a curl glob.
          api() {
            printf 'X-Auth-Token: %s\nX-Organization-Id: %s\nContent-Type: application/vnd.api+json\n' \
              "$PRODUCTIVE_API_TOKEN" "$PRODUCTIVE_ORG_ID" \
              | curl --silent --show-error --globoff --header @- --output "$RESPONSE" \
                --write-out '%{http_code}' "https://api.productive.io/api/v2/$1" || true
          }
          denied() {
            echo "::warning title=Productive task::Productive returned HTTP $1 for $2. Check that PRODUCTIVE_API_TOKEN is valid and organization-id is right."
            skip "Productive returned HTTP $1; the review uses the PR description."
          }

          # Candidates, best guess first: "id:<task id>" or "code:<task code>".
          CANDIDATES=()
          LINK_ID=$(printf '%s' "$PR_BODY" | grep -oE 'app\.productive\.io/[^ )>]*/task/[0-9]+' \
            | head -1 | grep -oE '[0-9]+$' || true)
          if [ -n "$LINK_ID" ]; then CANDIDATES+=("id:$LINK_ID"); fi
          IFS=/ read -ra SEGMENTS <<< "$PR_BRANCH"
          for segment in "${SEGMENTS[@]}"; do
            if [[ "$segment" =~ ^([0-9]{6,})([-_]|$) ]]; then
              CANDIDATES+=("id:${BASH_REMATCH[1]}")
            elif [[ "$segment" =~ ^([A-Za-z0-9]+(-[0-9]+)+) ]]; then
              # Task code formats vary, so also try it with trailing numbers
              # dropped: 4K-26-4-19-2-fix tries 4K-26-4-19-2, 4K-26-4-19, 4K-26-4.
              code="${BASH_REMATCH[1]}"
              while [[ "$code" == *-* ]]; do
                CANDIDATES+=("code:$code")
                code="${code%-*}"
              done
            fi
          done
          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            skip "No task link in the PR description and no task ID or code in branch '$PR_BRANCH'."
          fi

          TASK_ID=""
          for candidate in "${CANDIDATES[@]}"; do
            ref="${candidate#*:}"
            if [ "${candidate%%:*}" = id ]; then
              status=$(api "tasks/$ref")
              case "$status" in
                2*) TASK_ID="$ref" ;;
                404) ;;
                *) denied "$status" "task $ref" ;;
              esac
            else
              status=$(api "tasks?filter[task_number]=$ref&page[size]=2")
              case "$status" in
                2*) ;;
                *) denied "$status" "task code $ref" ;;
              esac
              # Task codes aren't unique across projects; never guess between tasks.
              case "$(jq '.data | length' "$RESPONSE")" in
                0) ;;
                1) TASK_ID=$(jq -r '.data[0].id' "$RESPONSE") ;;
                *) skip "Task code $ref matches more than one task. Link the task in the PR description." ;;
              esac
            fi
            if [ -n "$TASK_ID" ]; then break; fi
          done
          if [ -z "$TASK_ID" ]; then
            skip "No Productive task matches the PR description or branch '$PR_BRANCH', or the token can't see its project."
          fi

          status=$(api "tasks/$TASK_ID")
          case "$status" in 2*) cp "$RESPONSE" task.json ;; *) denied "$status" "task $TASK_ID" ;; esac
          status=$(api "todos?filter[task_id]=$TASK_ID&page[size]=200")
          case "$status" in 2*) cp "$RESPONSE" todos.json ;; *) echo '{"data":[]}' > todos.json ;; esac
          # Descriptions are HTML; plain text keeps the lists at a fraction of the tokens.
          jq -r --slurpfile todos todos.json --arg id "$TASK_ID" '
            def text: gsub("<br */?>|</p>|</li>|</h[1-6]>|</div>"; "\n") | gsub("<li[^>]*>"; "- ")
              | gsub("<[^>]+>"; "") | gsub("&nbsp;"; " ") | gsub("&lt;"; "<") | gsub("&gt;"; ">")
              | gsub("&quot;"; "\"") | gsub("&#0*39;|&apos;"; "\u0027") | gsub("&amp;"; "&");
            .data.attributes as $t
            | "# \($t.task_number // $id): \($t.title)\n\n\(($t.description // "") | text)\n\n## To-dos\n"
              + ($todos[0].data // [] | sort_by(.attributes.position)
                 | map("- [\(if .attributes.closed then "x" else " " end)] \(.attributes.description)")
                 | if length == 0 then "None." else join("\n") end)
          ' task.json > "$OUT" \
            || skip "Could not read Productive task $TASK_ID; the review uses the PR description."
          echo "**Productive task:** $(head -1 "$OUT" | sed 's/^# //') (ID $TASK_ID)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          # Set one of the two secrets: a Claude subscription token or an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow token instead of the Claude App token exchange, which
          # requires the project's workflow file to match its default branch and so
          # would fail on PRs that change it. Comments are posted as github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # To debug a run, uncomment to print Claude's full transcript in the Actions log.
          # show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PRODUCTIVE TASK FILE: .claude-review/ticket.md

            Read docs/agents/pr-review/README.md and follow it to review this
            pull request.
          # To pin a model, add e.g. --model claude-sonnet-5-5 at the start.
          claude_args: '--allowed-tools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

      - name: Remove trigger label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # A cancelled run may find the label already gone; that's fine.
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "claude review" || true
