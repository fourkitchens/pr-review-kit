# Shared Claude Code review workflow. Each project's
# .github/workflows/claude-review.yml calls it (see templates/workflow/claude-review.yml),
# so changes here reach every project on its next run.
#
# It runs in the calling project's context: it checks out the project, reads the
# project's docs/agents/pr-review/, and reviews the PR that triggered the caller.
# The label is removed when the run finishes so it can be re-added to review again.
#
# Setup steps: https://github.com/fourkitchens/pr-review-kit/blob/main/docs/SETUP.md
#
# Note: for pull requests opened from forks, GitHub does not expose secrets, so the
# review will not run for fork PRs.

name: Claude Code Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      PRODUCTIVE_API_TOKEN:
        required: false
      PRODUCTIVE_ORG_ID:
        required: false

env:
  # Productive organization: the PRODUCTIVE_ORG_ID secret if set, else Four Kitchens.
  PRODUCTIVE_ORG_ID: ${{ secrets.PRODUCTIVE_ORG_ID || '59815' }}

jobs:
  review:
    runs-on: ubuntu-latest
    # One review per PR at a time: adding the label again cancels the running one.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Fetches the Productive task so the review can check its acceptance
      # criteria. Finds the task ID in a task link in the PR description, or else
      # at the start of a branch segment (feature/21323404-login-fix). Skipped
      # quietly when there is no token or no task; the review then falls back to
      # the PR description.
      - name: Fetch Productive task
        env:
          PRODUCTIVE_API_TOKEN: ${{ secrets.PRODUCTIVE_API_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.claude-review/ticket.md"
          mkdir -p "$(dirname "$OUT")"
          if [ -z "$PRODUCTIVE_API_TOKEN" ]; then
            echo "No Productive token; skipping." | tee "$OUT"
            exit 0
          fi
          # Headers go to curl on stdin, so the token stays out of the process
          # list. --globoff: filter[...] in the URL is not a curl glob.
          api() {
            printf 'X-Auth-Token: %s\nX-Organization-Id: %s\nContent-Type: application/vnd.api+json\n' \
              "$PRODUCTIVE_API_TOKEN" "$PRODUCTIVE_ORG_ID" \
              | curl --silent --show-error --fail --globoff --header @- \
                "https://api.productive.io/api/v2/$1"
          }

          # 1. A task link: https://app.productive.io/<org>/[projects/<id>/]tasks/task/<task id>
          TASK_ID=$(printf '%s' "$PR_BODY" | grep -oE 'app\.productive\.io/[^ )>]*/task/[0-9]+' \
            | head -1 | grep -oE '[0-9]+$' || true)
          # 2. The task ID at the start of a branch segment: feature/21323404-login-fix.
          if [ -z "$TASK_ID" ]; then
            TASK_ID=$(printf '%s' "$PR_BRANCH" | grep -oE '(^|/)[0-9]{6,}([-_/]|$)' \
              | head -1 | grep -oE '[0-9]+' || true)
          fi
          if [ -z "$TASK_ID" ]; then
            echo "No Productive task link in the PR description or task ID in the branch name; skipping." | tee "$OUT"
            exit 0
          fi

          if ! api "tasks/$TASK_ID" > task.json; then
            echo "Could not fetch Productive task $TASK_ID." | tee "$OUT"
            exit 0
          fi
          api "todos?filter[task_id]=$TASK_ID&page[size]=200" > todos.json || echo '{"data":[]}' > todos.json
          # Descriptions are HTML; plain text keeps the lists at a fraction of the tokens.
          jq -r --slurpfile todos todos.json --arg id "$TASK_ID" '
            def text: gsub("<br */?>|</p>|</li>|</h[1-6]>|</div>"; "\n") | gsub("<li[^>]*>"; "- ")
              | gsub("<[^>]+>"; "") | gsub("&nbsp;"; " ") | gsub("&lt;"; "<") | gsub("&gt;"; ">")
              | gsub("&quot;"; "\"") | gsub("&#0*39;|&apos;"; "\u0027") | gsub("&amp;"; "&");
            .data.attributes as $t
            | "# \($t.task_number // $id): \($t.title)\n\n\(($t.description // "") | text)\n\n## To-dos\n"
              + ($todos[0].data // [] | sort_by(.attributes.position)
                 | map("- [\(if .attributes.closed then "x" else " " end)] \(.attributes.description)")
                 | if length == 0 then "None." else join("\n") end)
          ' task.json > "$OUT" \
            || echo "Could not read Productive task $TASK_ID." | tee "$OUT"

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          # Set one of the two secrets: a Claude subscription token or an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow token instead of the Claude App token exchange, which
          # requires the project's workflow file to match its default branch and so
          # would fail on PRs that change it. Comments are posted as github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # To debug a run, uncomment to print Claude's full transcript in the Actions log.
          # show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PRODUCTIVE TASK FILE: .claude-review/ticket.md

            Read docs/agents/pr-review/README.md and follow it to review this
            pull request.
          # To pin a model, add e.g. --model claude-sonnet-5-5 at the start.
          claude_args: '--allowed-tools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

      - name: Remove trigger label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # A cancelled run may find the label already gone; that's fine.
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "claude review" || true
