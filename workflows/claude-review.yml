# Runs a Claude Code review on a pull request when it is labeled "claude review".
# The label is removed when the run finishes so it can be re-added to review again.
#
# Setup steps: https://github.com/fourkitchens/pr-review-kit
# The review instructions live in docs/agents/pr-review/.
#
# Note: for pull requests opened from forks, GitHub does not expose secrets, so the
# review will not run for fork PRs.

name: Claude Code Review

on:
  pull_request:
    types: [labeled]

env:
  # ClickUp ticket id in the PR body, e.g. 'BCJ-[0-9]+'. Leave empty to skip ClickUp.
  TICKET_PATTERN: '<PREFIX>-[0-9]+'
  # Four Kitchens ClickUp workspace.
  CLICKUP_TEAM_ID: '36718269'

jobs:
  review:
    if: github.event.label.name == 'claude review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Fetches the ClickUp ticket linked in the PR body so the review can check
      # its acceptance criteria. Skipped quietly when there is no token, no
      # pattern or no ticket id; the review then falls back to the PR description.
      - name: Fetch ClickUp ticket
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.claude-review/ticket.md"
          mkdir -p "$(dirname "$OUT")"
          TICKET=""
          if [ -n "$TICKET_PATTERN" ]; then
            TICKET=$(printf '%s' "$PR_BODY" | grep -oE "$TICKET_PATTERN" | head -1 || true)
          fi
          if [ -z "$CLICKUP_API_TOKEN" ] || [ -z "$TICKET" ]; then
            echo "No ClickUp token or ticket id; skipping." | tee "$OUT"
            exit 0
          fi
          if curl -sSf -H "Authorization: $CLICKUP_API_TOKEN" \
            "https://api.clickup.com/api/v2/task/${TICKET}?custom_task_ids=true&team_id=${CLICKUP_TEAM_ID}&include_markdown_description=true" \
            -o task.json; then
            jq -r '"# \(.custom_id // .id): \(.name)\n\nURL: \(.url)\nStatus: \(.status.status)\n\n\(.markdown_description // .text_content // "")\n\n## Checklists\n\((.checklists // []) | map("### \(.name)\n" + ((.items // []) | map("- [\(if .resolved then "x" else " " end)] \(.name)") | join("\n"))) | join("\n\n"))"' \
              task.json > "$OUT"
          else
            echo "Could not fetch ClickUp ticket $TICKET." | tee "$OUT"
          fi

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          # Set one of the two secrets: a Claude subscription token or an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow token instead of the Claude App token exchange, which
          # requires this file to match the default branch and so would fail on PRs
          # that change it. Comments are posted as github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            CLICKUP TICKET FILE: .claude-review/ticket.md

            Read docs/agents/pr-review/README.md and follow it to review this
            pull request.
          # To pin a model, add e.g. --model claude-sonnet-5-5 at the start.
          claude_args: '--allowed-tools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

      - name: Remove trigger label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "claude review"
